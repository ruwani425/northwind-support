# Docker Compose environment for SupportDesk: SQL Server 2022 + .NET 10 API
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportdesk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Password1}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - supportdesk-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      default:
        aliases:
          - db
          - sqlserver

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: supportdesk-api
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=SupportDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Password1};TrustServerCertificate=True;Encrypt=False"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-SupportDesk-Super-Secret-Jwt-Key-For-Northwind-32-Bytes!}"
      Jwt__Issuer: "${JWT_ISSUER:-SupportDesk}"
      Jwt__Audience: "${JWT_AUDIENCE:-SupportDesk}"
      Jwt__LifetimeHours: "${JWT_LIFETIME_HOURS:-8}"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  supportdesk-sql:
